# Deploy: from edge/api, with CLOUDFLARE_API_TOKEN set: npx wrangler@4 deploy
# The secret is set once with: npx wrangler@4 secret put ORIGIN_AUTH (same value as ORIGIN_AUTH in Vercel production)
name = "homyz-api-edge"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "803b01a6e3e53ef41f175e2a54e51372"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.homyz.himaiz.com", custom_domain = true }]

[vars]
ORIGIN = "https://homyz-real-estate-backend.vercel.app"

[observability]
enabled = true
