# Deployed by Cloudflare Workers Builds on push to main when edge/api/ changes (fallback: npx wrangler@4 deploy).
# The secret is set once with: npx wrangler@4 secret put ORIGIN_AUTH (same value as ORIGIN_AUTH in the API's
# Secret Manager secret, homyz-secrets)
name = "homyz-api-edge"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "803b01a6e3e53ef41f175e2a54e51372"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.homyz.himaiz.com", custom_domain = true }]

[vars]
# The API on Cloud Run (service homyz-backend, us-central1).
ORIGIN = "https://homyz-backend-913220110827.us-central1.run.app"

# Daily keep-alive so Atlas doesn't pause the free cluster (see scheduled() in index.js).
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true
# Cloudflare attaches the request URL to every log event; strip its query, which can carry ids and junk from scanners.
redact_query_string = true

# Only the Worker's own JSON line (LOGGING.md). Cloudflare's per-request invocation log repeats it and records the
# full URL, query included.
[observability.logs]
invocation_logs = false
